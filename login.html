<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" type="text/css" href="resources/css/component/common.css">
	<link rel="stylesheet" type="text/css" href="resources/css/plugin/swiper-bundle.min.css">
	<link rel="stylesheet" type="text/css" href="resources/css/common/layout.css">
	
	<script src="resources/js/plugin/swiper-bundle.min.js" defer></script>
	<script src="resources/js/component/ui-script.js" defer></script>

	<title>로그인</title>

</head>
<body>
<div id="wrap">	
		<!-- 로그인 영역 start-->
		<div class="login-inner">
			<h1><img src="" alt="로고이미지"></h1>
			<div class="form-group">
				<div class="form-tit">
					<label for="consult_name">아이디</label>
				</div>
				<div class="form-conts">
					<input type="text" id="consult_name" class="krds-input" placeholder="아이디를 입력하세요">
				</div>
			</div>
			<div class="form-group">
				<div class="form-tit">
					<label for="consult_name">비밀번호</label>
				</div>
				<div class="form-conts">
					<input type="password" id="consult_password" class="krds-input" placeholder="비밀번호를 입력하세요">
				</div>
			</div>
			<div class="form-group label">
				<div class="krds-form-check medium">
					<input type="checkbox" id="chk_1-2a">
					<label for="chk_1-2a">아이디저장</label>
				</div>
			</div>
			<div class="form-login">
				<button type="button" class="krds-btn medium">
					로그인
				</button>
			</div>
		</div>
</div>
</body>
</html>
